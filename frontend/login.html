<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Login - Multi-Album Manager</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📖</text></svg>">

<link rel="stylesheet" href="/login.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>

<body>

<div class="container">

    <div class="login-box">

        <h1>Admin Portal</h1>
        <p>Sign in to manage your flip albums</p>

        <form id="loginForm" onsubmit="event.preventDefault(); login();">
            <input
                type="email"
                id="email"
                placeholder="Email address (e.g. admin@flipalbum.com)"
                autocomplete="email"
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
                autocomplete="current-password"
            >

            <button type="submit" id="loginBtn">
                Sign In
            </button>
        </form>

        <div id="message"></div>

        <div style="margin-top:25px; font-size:12px; opacity:0.6;">
            <a href="/" style="color:white; text-decoration:none;">⬅ Back to Public Flip Album</a>
        </div>

    </div>

</div>

<script src="/config.js"></script>
<script src="/login.js"></script>

</body>
</html>
