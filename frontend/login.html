<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Admin Login</title>

<link rel="stylesheet"
href="login.css">

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
rel="stylesheet">

</head>

<body>

<div class="container">

    <div class="login-box">

        <h1>Admin Panel</h1>

        <p>Secure Login Access</p>

        <input
        type="password"
        id="password"
        placeholder="Enter Password">

        <button
        onclick="login()">

        Login

        </button>

        <div id="message"></div>

    </div>

</div>

<script src="login.js"></script>

</body>
</html>
