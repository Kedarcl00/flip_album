<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Advanced StPageFlip Book</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📖</text></svg>">

<!-- StPageFlip Library -->
<script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>

<link rel="stylesheet" href="style.css">
<!-- Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

</style>
</head>

<body style="
background:
linear-gradient(
rgba(0,0,0,0.7),
rgba(0,0,0,0.7)
),
url('sounds/DSC_5323.JPG');

background-size:cover;
background-position:center;
">    

<div id="loader">
    <h4> When Tirtha Turns One!</h4>
    <h5>15April 2026</h5>
    <h4></h4>
    <h2>Loading Memories...</h2>
    <div id="percentage">0%</div>
</div>

<div id="flipbook" style="display:none;">
    <!-- Album Content -->
</div>


<div class="wrapper">


    <!-- BOOK -->

    <div class="book-container" id="bookContainer">

        <div id="book">


            <!-- COVER -->

            
        </div>
        <div id="pageCounter">
        Page 0 of 0
        </div>

    </div>

    <!-- TOOLBAR -->

    <div class="toolbar">

        <button id="prevBtn">⬅ Prev</button>

        <button id="fullscreenBtn">⛶ Fullscreen</button>

         <button id="nextBtn">Next ➡</button>
       

    </div>

</div>

<!-- FLIP SOUND -->

<audio id="flipSound">
    <source src="sounds/freesound_community-pageturn-102978.mp3" type="audio/mpeg">
</audio>


<script src="script.js?v=3"></script>

</body>
</html>
